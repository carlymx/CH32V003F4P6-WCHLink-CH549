; ---------------------------------------------------------------------------
;  CH32V003F4P6 - configuracion de PlatformIO
;
;  Grabacion con el WCH-Link antiguo (CH549) reflasheado con el firmware SWIO
;  de ch549-link, mediante minichlink (-C ardulink).
;
;  No lleva ninguna ruta absoluta: el proyecto es autocontenido y, si falta
;  minichlink, flash.sh lo descarga en <proyecto>/tools/minichlink/.
;
;  No uses upload_protocol = wch-link / minichlink / wlink / isp: ninguno
;  entiende este programador.
; ---------------------------------------------------------------------------

[env:genericCH32V003F4P6]
platform  = ch32v
board     = genericCH32V003F4P6
framework = arduino

; Opcional pero explicito: el board ya trae build.core = openwch.
; El core "arduino" clasico NO soporta el CH32V003.
board_build.core = openwch

monitor_speed    = 115200

; --- Grabacion (WCH-Link CH549 con firmware SWIO) --------------------------
; "custom" porque ningun protocolo de serie (wch-link / minichlink / wlink /
; isp) entiende este programador: solo habla el protocolo ardulink.
upload_protocol = custom
upload_command  = ./flash.sh $SOURCE
