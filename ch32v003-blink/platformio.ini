; ---------------------------------------------------------------------------
;  Proyecto CH32V003F4P6  -  PlatformIO
;
;  Programador: WCH-Link antiguo (CH549) REFLASHEADO con el firmware SWIO
;  del proyecto ch549-link.  Habla el protocolo "ardulink" por USB-CDC y
;  se maneja con minichlink.
;
;  Compilar:  pio run
;  Grabar:    pio run -t upload
; ---------------------------------------------------------------------------

[env:ch32v003f4p6]
platform  = ch32v
board     = genericCH32V003F4P6
framework = arduino
board_build.core = openwch        ; core Arduino de WCH (openwch/arduino_core_ch32)
monitor_speed    = 115200

; --- Grabación -------------------------------------------------------------
; "custom" + upload_command: PlatformIO llama a nuestro script, que usa
; minichlink con el protocolo ardulink.  No usamos "wlink" porque ese
; protocolo solo lo entiende un WCH-LinkE original, no nuestro CH549.
upload_protocol = custom
upload_command  = ./flash.sh $SOURCE
