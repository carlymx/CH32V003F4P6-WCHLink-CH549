; ---------------------------------------------------------------------------
;  Plantilla de platformio.ini para el CH32V003F4P6 grabado con el
;  WCH-Link antiguo (CH549) reflasheado con el firmware SWIO de ch549-link.
;
;  Esta plantilla es GENERICA a proposito: no lleva ninguna ruta absoluta.
;  El proyecto se lo monta flash.sh solo (si falta minichlink lo descarga
;  en <proyecto>/tools/minichlink/).
;
;  Copiala a la raiz del proyecto nuevo, junto a flash.sh.
;
;  Lo que el asistente de PlatformIO NO pone y hay que anadir a mano:
;     upload_protocol = custom
;     upload_command  = ./flash.sh $SOURCE
; ---------------------------------------------------------------------------

[env:genericCH32V003F4P6]
platform  = ch32v
board     = genericCH32V003F4P6
framework = arduino

; Opcional pero explicito: el board ya trae build.core = openwch.
; El core "arduino" clasico NO soporta el CH32V003.
board_build.core = openwch

monitor_speed    = 115200

; --- Grabacion (WCH-Link CH549 con firmware SWIO) --------------------------
; "custom" porque ningun protocolo de serie (wch-link / minichlink / wlink /
; isp) entiende este programador: solo habla el protocolo ardulink.
upload_protocol = custom
upload_command  = ./flash.sh $SOURCE
